name: MeePix CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No releases, write tokens, credentials, or live model/ComfyUI access in CI.
permissions:
  contents: read

concurrency:
  group: meepix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Frontend compile and Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            libgtk-3-dev pkg-config patchelf
      - name: Use stable Rust
        run: rustup update stable
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate placeholder platform icons
        run: npm run icons
      - name: Type-check and compile frontend
        run: npm run build
      - name: Frontend interaction tests
        run: npm test
      - name: Run Rust tests
        run: |
          cargo test --manifest-path crates/sprite-core/Cargo.toml
          cargo test --manifest-path crates/easel-client/Cargo.toml
          cargo test --manifest-path crates/meepix-app/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

  arch-package:
    name: Arch Linux x86_64 native pacman package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Make a local Git ref to the exact CI checkout
        run: git branch --force meepix-ci-package "$GITHUB_SHA"
      - name: Build PKGBUILD on Arch Linux
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meepix-arch-packages"
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/meepix-arch-packages,dst=/packages" \
            archlinux:base-devel bash -euo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm \
                git nodejs npm rust cargo pkgconf openssl file \
                webkit2gtk-4.1 gtk3 libappindicator librsvg xdotool
              useradd -m -u 1000 builder
              mkdir -p /build
              cp /repo/packaging/arch/PKGBUILD /build/PKGBUILD
              chown builder:builder /build
              runuser -u builder -- bash -euo pipefail -c "\
                git config --global --add safe.directory /repo; \
                cd /build; \
                MEEPIX_GIT_URL=file:///repo MEEPIX_GIT_REF=meepix-ci-package \
                  makepkg --noconfirm --force --cleanbuild"
              cp /build/meepix-git-*.pkg.tar.zst /packages/
              pacman -Qip /packages/meepix-git-*.pkg.tar.zst
              pacman -Qlp /packages/meepix-git-*.pkg.tar.zst > /tmp/meepix-package-files
              grep -q "/usr/bin/meepix" /tmp/meepix-package-files
              grep -q "/usr/share/applications/meepix.desktop" /tmp/meepix-package-files
              grep -q "/usr/share/icons/hicolor/scalable/apps/meepix.svg" /tmp/meepix-package-files
            '
      - name: Archive native pacman package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meepix-arch-x64
          path: ${{ runner.temp }}/meepix-arch-packages/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (AppImage)
            # Older glibc baseline for broad Linux/Arch compatibility.
            runner: ubuntu-22.04
            bundles: appimage
            artifact: meepix-linux-x64-appimage
            artifact_path: src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows x64
            runner: windows-2022
            bundles: nsis
            artifact: meepix-windows-x64
            artifact_path: src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: macOS ARM64
            runner: macos-15
            bundles: dmg
            artifact: meepix-macos-arm64
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS x64
            runner: macos-15-intel
            bundles: dmg
            artifact: meepix-macos-x64
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            libgtk-3-dev pkg-config patchelf
      - name: Use stable Rust
        run: rustup update stable
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Verify project persistence on this platform
        run: cargo test --manifest-path crates/sprite-core/Cargo.toml
      - name: Package native application (no publishing)
        env:
          # Ad-hoc signing is suitable for CI smoke builds, not notarized releases.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          # AppImage build tooling can run without a FUSE mount in GitHub runners.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --bundles '${{ matrix.bundles }}'
      - name: Upload installer for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
