[package]
name = "meepix"
version = "0.1.0"
description = "MeePix pixel art studio"
authors = ["MeePix contributors"]
edition = "2021"

[lib]
name = "meepix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

meepix-app = { path = "../crates/meepix-app" }
sprite-core = { path = "../crates/sprite-core" }
easel-client = { path = "../crates/easel-client" }
